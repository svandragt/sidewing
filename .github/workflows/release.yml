name: Release

on:
  push:
    tags:
      - '0.*'
      - '1.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build and upload to'
        required: true
        type: string

permissions:
  contents: write

jobs:
  deb:
    name: Build .deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential devscripts equivs dpkg-dev debhelper \
            meson ninja-build valac pkg-config \
            libgtk-4-dev libgee-0.8-dev libjson-glib-dev libx11-dev

      - name: Build deb
        run: dpkg-buildpackage -us -uc -b

      - name: Collect artifacts
        run: |
          mkdir -p dist
          mv ../sidewing_*_*.deb dist/

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-24.04
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: sidewing.flatpak
          manifest-path: flatpak/com.vandragt.sidewing.yaml
          cache-key: flatpak-builder-${{ github.sha }}

  release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    needs: [deb, flatpak]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: sidewing.flatpak
          path: dist

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber
