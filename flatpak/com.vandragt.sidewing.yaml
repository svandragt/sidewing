app-id: com.vandragt.sidewing
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: sidewing

finish-args:
  - --socket=x11
  - --filesystem=host
  - --share=network
  - --talk-name=org.freedesktop.systemd1
  - --filesystem=~/.config/systemd/user:create

modules:
  - name: libgee
    buildsystem: meson
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libgee/0.20/libgee-0.20.8.tar.xz
        sha256: c3713f2f3bc12c8cff25f2a8bb9170d0cebea9816e11d3b4c1d56c97cd323282

  - name: sidewing
    buildsystem: meson
    sources:
      - type: dir
        path: ..
