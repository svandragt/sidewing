app-id: com.vandragt.sidewing
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: sidewing

finish-args:
  - --socket=x11
  - --filesystem=host
  - --share=network
  - --talk-name=org.freedesktop.systemd1
  - --filesystem=~/.config/systemd/user:create

modules:
  - name: libgee
    buildsystem: meson
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libgee/0.20/libgee-0.20.8.tar.xz
        sha256: 189815ac143d89867193b0c52b7dc31f3aa108a15f04d6b5dca2b6adfad0b0ee

  - name: sidewing
    buildsystem: meson
    sources:
      - type: dir
        path: ..
